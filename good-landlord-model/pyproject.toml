[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "good-landlord-model"
version = "0.1.0"
description = "Landlord quality scoring via adjusted tenant performance"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0,<3.0",
    "pyarrow>=14.0",
    "numpy>=1.26,<2.0",
    "scikit-learn>=1.4,<2.0",
    "catboost>=1.2,<2.0",
    "xgboost>=2.0,<3.0",
    "lightgbm>=4.0,<5.0",
    "shap>=0.45,<1.0",
    "pyyaml>=6.0",
    "matplotlib>=3.8,<4.0",
    "seaborn>=0.13,<1.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "jupyter>=1.0",
    "ipykernel>=6.0",
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1,<4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: optional heavier tests (TreeExplainer smoke, etc.)",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "notebooks/*"]
